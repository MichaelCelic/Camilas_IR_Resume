<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campa's Scooperia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loader" class="loader">
    <h1>Camila Campa Presents</h1>
    <div class="load-track" aria-hidden="true">
      <div id="load-fill" class="load-fill"></div>
    </div>
  </div>

  <main id="stage" class="stage" hidden>
    <div id="frame" class="frame">
      <img id="shot" alt="">
      <div id="hotspots"></div>
      <div id="panel" class="panel" hidden>
        <div class="panel-card" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <button id="panel-close" type="button">Close</button>
          <h2 id="panel-title"></h2>
          <div id="panel-body"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
